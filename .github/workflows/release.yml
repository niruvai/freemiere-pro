name: Release

# Push a tag like v2.3.0 to build the macOS apps and publish them as a GitHub Release.
# The app's built-in updater installs the .zip for the user's chip from the latest release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use Intel FFmpeg and FFprobe
        if: matrix.arch == 'x64'
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          npm install --no-save --force @ffprobe-installer/darwin-x64@5.1.0
          file node_modules/ffmpeg-static/ffmpeg node_modules/@ffprobe-installer/darwin-x64/ffprobe

      - name: Build app, DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Check the packaged app
        run: |
          APP="$(ls -d dist/mac*/*.app | head -1)"
          echo "App: $APP"
          codesign --verify --deep --verbose=2 "$APP"
          file "$APP/Contents/MacOS/Freemiere Pro"
          find "$APP" -path '*ffmpeg-static/ffmpeg' -exec file {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: freemiere-pro-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-footer.md >> notes.md
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Freemiere Pro ${TAG#v}" --notes-file notes.md
            gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/*.zip --title "Freemiere Pro ${TAG#v}" --notes-file notes.md --verify-tag
          fi
