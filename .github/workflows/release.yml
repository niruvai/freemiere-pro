name: Release

# Bump "version" in package.json and push to main: if there's no release for that
# version yet, this builds the macOS apps (Apple silicon + Intel) and publishes
# release vX.Y.Z. The app's built-in updater installs it from the latest release.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Will build and publish v$VERSION."
          fi

  build:
    name: Build (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use Intel FFmpeg and FFprobe
        if: matrix.arch == 'x64'
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          npm install --no-save --force @ffprobe-installer/darwin-x64@5.1.0
          file node_modules/ffmpeg-static/ffmpeg node_modules/@ffprobe-installer/darwin-x64/ffprobe

      - name: Build app, DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Check the packaged app
        run: |
          APP="$(ls -d dist/mac*/*.app | head -1)"
          echo "App: $APP"
          codesign --verify --deep --verbose=2 "$APP"
          file "$APP/Contents/MacOS/Freemiere Pro"
          find "$APP" -path '*ffmpeg-static/ffmpeg' -exec file {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: freemiere-pro-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-footer.md >> notes.md
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.version.outputs.version }}"
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/*.zip --target "$GITHUB_SHA" --title "Freemiere Pro ${TAG#v}" --notes-file notes.md --latest
          fi
