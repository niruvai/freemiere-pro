<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Freemiere Pro</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid; grid-template-columns: 250px 1fr; gap: 16px; padding: 14px;
    box-sizing: border-box; background: #fff; color: #2c2c2c;
    font: 12px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-app-region: drag;
  }
  .side { display: flex; flex-direction: column; padding: 8px 4px 6px 8px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 52px; height: 52px; border-radius: 11px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .brand h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.2px; color: #111; }
  .meta { margin-top: 40px; color: #6b6b6b; font-size: 11px; }
  .meta p { margin: 0 0 12px; }
  .status { margin-top: 6px; color: #6b6b6b; font-size: 11px; min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .foot { display: flex; align-items: center; gap: 8px; color: #333; font-weight: 600; font-size: 12.5px; }
  .foot .dot { width: 18px; height: 18px; border-radius: 5px; background: conic-gradient(from 210deg, #4c8dff, #8f5bff, #ff4f8b, #ffb03b, #4c8dff); box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 5px rgba(0,0,0,.08); }
  .art { position: relative; border-radius: 10px; overflow: hidden; background: #1b1530; }
  .art canvas { width: 100%; height: 100%; display: block; }
  .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: rgba(255,255,255,.85); transition: width .35s ease; }
</style>
</head>
<body>
  <div class="side">
    <div class="brand"><img src="assets/icon.png" alt=""><h1>Freemiere Pro</h1></div>
    <div class="meta">
      <p>© 2026 Nurunnabi Islam. All rights reserved.</p>
      <p id="ver">Version</p>
      <p>Artwork generated by Freemiere Pro for this release.</p>
    </div>
    <div class="status" id="status">Starting…</div>
    <div class="spacer"></div>
    <div class="foot"><span class="dot"></span>Free video editor for macOS</div>
  </div>
  <div class="art"><canvas id="art"></canvas><div class="bar" id="bar"></div></div>
  <script src="js/splash.js"></script>
</body>
</html>
